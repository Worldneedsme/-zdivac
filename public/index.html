<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kör Randevu</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Giriş / Kayıt -->
  <section id="auth" class="screen hidden">
    <div class="auth-card">
      <div class="brand">
        <h1><span class="logo">🙈</span> Kör Randevu</h1>
        <p>Önce sohbet, 5 soru. Sonra ikiniz de isterseniz fotoğraflar açılır.</p>
      </div>
      <div class="tabs">
        <button class="tab active" data-auth-tab="login">Giriş</button>
        <button class="tab" data-auth-tab="register">Kayıt Ol</button>
      </div>

      <form id="login-form" class="form">
        <input name="email" type="email" placeholder="E-posta" required autocomplete="email">
        <input name="password" type="password" placeholder="Şifre" required autocomplete="current-password">
        <button class="btn primary" type="submit">Giriş Yap</button>
      </form>

      <form id="register-form" class="form hidden">
        <div class="row">
          <input name="name" placeholder="İsim" maxlength="30" required>
          <input name="age" type="number" min="18" max="99" placeholder="Yaş" required>
        </div>
        <div class="row">
          <input name="hometown" placeholder="Nerelisin?" maxlength="40" required>
          <input name="occupation" placeholder="Mesleğin" maxlength="40" required>
        </div>
        <div class="row">
          <select name="gender" required>
            <option value="">Cinsiyetin</option>
            <option value="kadin">Kadın</option>
            <option value="erkek">Erkek</option>
            <option value="diger">Diğer</option>
          </select>
          <select name="interestedIn" required>
            <option value="">Kimi arıyorsun?</option>
            <option value="kadin">Kadın</option>
            <option value="erkek">Erkek</option>
            <option value="herkes">Herkes</option>
          </select>
        </div>
        <input name="email" type="email" placeholder="E-posta" required autocomplete="email">
        <input name="password" type="password" placeholder="Şifre (en az 6 karakter)" minlength="6" required autocomplete="new-password">
        <div class="photo-row">
          <label class="file-chip">📷 Fotoğraf seç
            <input name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          </label>
          <div id="register-preview" class="thumbs"><span class="hint">1-6 adet, 5 sorudan sonra görünür</span></div>
        </div>
        <button class="btn primary" type="submit">Kayıt Ol</button>
      </form>
      <p id="auth-error" class="error"></p>
    </div>
  </section>

  <!-- Ana uygulama -->
  <section id="app" class="screen hidden">
    <header class="topbar">
      <span class="topbar-title">🙈 Kör Randevu</span>
    </header>

    <main>
      <!-- Keşfet -->
      <div id="view-discover" class="view">
        <div id="card-stack" class="card-stack"></div>
        <div class="swipe-actions">
          <button id="btn-pass" class="round-btn pass" title="Geç">✕</button>
          <button id="btn-like" class="round-btn like" title="Beğen">♥</button>
        </div>
      </div>

      <!-- Sohbet listesi -->
      <div id="view-chats" class="view hidden">
        <h2 class="view-title">Eşleşmeler</h2>
        <ul id="chat-list" class="chat-list"></ul>
      </div>

      <!-- Profil -->
      <div id="view-profile" class="view hidden">
        <div class="profile-head">
          <div id="profile-name" class="profile-name"></div>
          <div id="profile-info" class="info-line"></div>
          <p class="hint">Diğerleri seni bu bilgilerle görür. Fotoğrafların 5 sorudan sonra açılır.</p>
        </div>
        <form id="profile-form" class="form profile-form">
          <div class="row">
            <input name="hometown" placeholder="Nerelisin?" maxlength="40" required>
            <input name="occupation" placeholder="Mesleğin" maxlength="40" required>
          </div>
          <button class="btn secondary" type="submit">Bilgileri kaydet</button>
        </form>
        <div id="profile-photos" class="photo-grid"></div>
        <div class="row">
          <label class="btn secondary file-btn">
            + Fotoğraf ekle
            <input id="add-photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          </label>
          <button id="btn-logout" class="btn ghost">Çıkış Yap</button>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="discover">🔥<span>Keşfet</span></button>
      <button class="nav-btn" data-view="chats">💬<span>Sohbetler</span><b id="chat-badge" class="badge hidden"></b></button>
      <button class="nav-btn" data-view="profile">👤<span>Profil</span></button>
    </nav>
  </section>

  <!-- Sohbet ekranı -->
  <section id="chat" class="screen hidden">
    <header class="chat-header">
      <button id="btn-back" class="icon-btn" title="Geri">←</button>
      <div id="chat-avatar" class="avatar"></div>
      <div class="chat-who">
        <div class="chat-name"><span id="chat-name"></span> <span id="chat-status" class="chat-status"></span></div>
        <div id="chat-info" class="chat-info"></div>
      </div>
      <span id="progress-text" class="pill q-pill"></span>
    </header>
    <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>

    <div id="reveal-panel" class="reveal-panel hidden"></div>
    <div id="messages" class="messages"></div>
    <div id="pending-panel" class="pending-panel hidden"></div>

    <form id="composer" class="composer">
      <div class="mode-switch"></div>
      <input id="composer-input" placeholder="Mesaj yaz..." autocomplete="off" maxlength="1000">
      <button class="btn primary send" type="submit" title="Gönder">➤</button>
    </form>
  </section>

  <!-- Eşleşme bildirimi -->
  <div id="match-modal" class="modal hidden">
    <div class="modal-card">
      <div class="match-emoji">💞</div>
      <h2>Eşleştiniz!</h2>
      <p id="match-text"></p>
      <button id="btn-match-chat" class="btn primary">Sohbete başla</button>
      <button id="btn-match-close" class="btn ghost">Sonra</button>
    </div>
  </div>

  <!-- Fotoğraf büyütme -->
  <div id="lightbox" class="modal hidden"><img alt=""></div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
